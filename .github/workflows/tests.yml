name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # pipefail ωστε το tee να μην καταπίνει τον κωδικό εξόδου του pytest.
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt

      - name: Show test output in the run summary
        if: always()
        run: |
          {
            echo '### pytest'
            echo '```'
            tail -n 120 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Η σύνοψη και τα logs θέλουν σύνδεση για να διαβαστούν. Τα annotations
      # όχι, και επιστρέφονται και από το REST API, οπότε η αιτία μιας αποτυχίας
      # φαίνεται χωρίς να χρειάζεται λογαριασμός.
      - name: Report failure as an annotation
        if: failure()
        run: |
          body=$(tail -n 40 pytest-output.txt | awk 'BEGIN{ORS="%0A"}{gsub(/%/,"%25");print}')
          echo "::error title=pytest::$body"
