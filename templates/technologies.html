<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Τεχνολογίες — yDev</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <a href="/home" class="back-link">← Πίσω στα projects</a>

    <div class="detail-card">
        <h1>Τεχνολογίες</h1>

        <form method="POST" action="/technologies-page" class="filter-bar">
            <input type="text" name="name" placeholder="Νέα τεχνολογία..." required>
            <button type="submit">Προσθήκη</button>
        </form>

        <p class="muted">{{ technologies|length }} συνολικά</p>

        {% for tech in technologies %}
            <div class="version-item">{{ tech.name }}</div>
        {% else %}
            <p class="muted">Δεν υπάρχει ακόμα καμία τεχνολογία.</p>
        {% endfor %}
    </div>
</body>
</html>
