<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Νέος κωδικός — yDev</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="auth-card">
        <h1>Νέος κωδικός</h1>

        {% if valid %}
            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}
            <form method="POST" action="/reset-password/{{ token }}">
                <label for="password">Νέος κωδικός</label>
                <input type="password" id="password" name="password" minlength="6" required>

                <button type="submit">Αποθήκευση</button>
            </form>
        {% else %}
            <p class="error-message">Ο σύνδεσμος επαναφοράς δεν είναι έγκυρος ή έχει λήξει.</p>
            <p class="muted"><a href="/forgot-password">Ζήτησε νέο σύνδεσμο</a></p>
        {% endif %}

        <p class="muted"><a href="/login-page">← Πίσω στη σύνδεση</a></p>
    </div>
</body>
</html>
