<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Επαναφορά κωδικού — yDev</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="auth-card">
        <h1>Επαναφορά κωδικού</h1>

        {% if message %}
            <p class="muted">{{ message }}</p>
        {% else %}
            <p class="muted">Δώσε το email σου και θα σου στείλουμε σύνδεσμο για νέο κωδικό.</p>
            <form method="POST" action="/forgot-password">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <button type="submit">Αποστολή συνδέσμου</button>
            </form>
        {% endif %}

        <p class="muted"><a href="/login-page">← Πίσω στη σύνδεση</a></p>
    </div>
</body>
</html>
